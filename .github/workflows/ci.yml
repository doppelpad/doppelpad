# The checks every change passes before it lands (the local check without the local paths):
# Windows builds, lints and tests everything, the GUI's frontend included; Linux checks the
# platform layer and the service and runs the tests that do not need Windows; macOS lints and
# tests every Rust crate, the app's included; and the crates still build with the oldest Rust
# the workspace claims (`rust-version`).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Warnings fail the build, as in the local check.
  RUSTFLAGS: -D warnings

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Frontend dependencies
        working-directory: gui
        run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      # The GUI crate is not a default member.
      - run: cargo test -p dp-gui
      - name: Frontend tests
        working-directory: gui
        run: npm test
      - name: Frontend type check
        working-directory: gui
        run: npm run check
      - name: Frontend formatting
        working-directory: gui
        run: npm run format:check

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check -p dp-platform -p dp-service
      - run: cargo clippy -p dp-platform -p dp-service --all-targets
      # dp-platform included: its Linux backend has tests that run nowhere else.
      - run: cargo test -p dp-core -p dp-config -p dp-platform -p dp-ipc -p dp-service

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The crates without the app (it needs the frontend), as `rust-version` in Cargo.toml.
      - run: cargo check --locked

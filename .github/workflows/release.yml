# Builds the Windows setup, the Linux AppImage and the macOS app (.dmg and the updater's
# .app.tar.gz, one build for Apple silicon and Intel) for a version tag and puts them on a
# draft GitHub release, with their updater signatures (.sig) and latest.json, which installed
# copies read to find updates (plugins.updater in gui/src-tauri/tauri.conf.json), and the
# Linux and macOS command-line tools. Publishing the draft ships the update.
#
# Release: set the version in Cargo.toml ([workspace.package]) and gui/package.json, commit,
# then `git tag -a v<version>` with the release notes as the tag message (the update dialog
# shows them) and push the tag. Tags with a hyphen (v1.2.0-beta.1) become prereleases, which
# the updater does not offer.
#
# Test build before a tag: Actions → Release → Run workflow, on any branch, builds the Linux
# and the macOS job and keeps the AppImage, the command-line tool, the list of the libraries in
# the AppImage and the source of its GPL libraries as the run's artifact "doppelpad-linux", and
# the macOS app and command-line tool as "doppelpad-macos". It makes no release.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD, the updater key
# that `tauri signer generate` made (see docs/GUI.md#updates). For a signed and notarized macOS
# app also APPLE_CERTIFICATE (the Developer ID Application certificate as base64 .p12),
# APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (an app-specific
# password) and APPLE_TEAM_ID. Until then MACOS_CERTIFICATE, MACOS_CERTIFICATE_PASSWORD and
# MACOS_SIGNING_IDENTITY sign it with a self-signed certificate that
# gui/scripts/macos-signing-certificate.sh made, so that macOS keeps its permissions across
# updates; Gatekeeper still asks before its first start. Without either the app is signed ad
# hoc (docs/MACOS.md#signing-releases).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    outputs:
      release_id: ${{ steps.tauri.outputs.releaseId }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag, the version and the updater key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          tag="$GITHUB_REF_NAME"
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)
          npm_version=$(node -p "require('./gui/package.json').version")
          if [ "$tag" != "v$version" ] || [ "$npm_version" != "$version" ]; then
            echo "::error::Tag $tag, Cargo.toml ($version) and gui/package.json ($npm_version) must name the same version"
            exit 1
          fi
          if grep -q 'REPLACE_WITH_THE_UPDATER_PUBLIC_KEY' gui/src-tauri/tauri.conf.json; then
            echo "::error::plugins.updater.pubkey in gui/src-tauri/tauri.conf.json is still the placeholder"
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The secret TAURI_SIGNING_PRIVATE_KEY is missing"
            exit 1
          fi

      # actions/checkout fetches an annotated tag as a plain one, without its message.
      - name: Release notes from the tag message
        id: notes
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          git fetch --force --depth=1 origin "+refs/tags/$tag:refs/tags/$tag"
          if [ "$(git cat-file -t "$tag")" != tag ]; then
            echo "::error::$tag is a lightweight tag: tag with 'git tag -a' and write the release notes as its message"
            exit 1
          fi
          # The message as written: without the tag's header and without a signature.
          {
            echo 'notes<<DP_RELEASE_NOTES'
            git cat-file tag "$tag" | sed '1,/^$/d; /^-----BEGIN .*SIGNATURE-----$/,$d'
            echo 'DP_RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Frontend dependencies
        working-directory: gui
        run: npm ci

      # `tauri build`: the setup, its .sig (bundle.createUpdaterArtifacts) and latest.json,
      # uploaded to a draft release for the tag.
      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: gui
          tagName: ${{ github.ref_name }}
          releaseName: Doppelpad ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.notes }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          updaterJsonPreferNsis: true

  # On a tag it runs after the Windows job and adds its files to that job's draft, and
  # tauri-action adds the Linux entry to the draft's latest.json (two jobs at once would each
  # write a latest.json of their own). Started by hand it runs alone and only builds.
  linux:
    needs: windows
    if: ${{ !failure() && !cancelled() }}
    # The oldest Ubuntu runner: the AppImage needs at least the glibc it is built with (2.35).
    runs-on: ubuntu-22.04
    env:
      # The Windows job's draft; empty when started by hand.
      RELEASE_ID: ${{ needs.windows.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for the app
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libgtk-layer-shell-dev patchelf file xdg-utils

      # The AppImage takes every gdk-pixbuf loader that is installed. The TIFF loader would
      # bring libtiff and with it jbigkit, which is under the GPL alone, and the app shows no
      # TIFF images.
      - name: No TIFF loader in the AppImage
        run: |
          sudo rm "$(pkg-config --variable=gdk_pixbuf_moduledir gdk-pixbuf-2.0)/libpixbufloader-tiff.so"
          sudo "$(pkg-config --variable=gdk_pixbuf_query_loaders gdk-pixbuf-2.0)" --update-cache

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Frontend dependencies
        working-directory: gui
        run: npm ci

      # `tauri build` with tauri.linux.conf.json: the AppImage and its .sig. On a tag they go to
      # the draft; without a release id and tag, tauri-action only builds. It writes
      # latest.json anew with releaseBody as the notes, so it gets the Windows job's.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: gui
          releaseId: ${{ env.RELEASE_ID }}
          tagName: ${{ env.RELEASE_ID && github.ref_name || '' }}
          releaseBody: ${{ needs.windows.outputs.notes }}
          releaseDraft: true

      # `doppelpad` for `doctor`, `daemon` and scripts, with its licenses.
      - name: Command-line tool
        id: cli
        run: |
          cargo build --release -p doppelpad
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)
          name="doppelpad_${version}_linux-x86_64"
          mkdir -p "linux-files/$name"
          cp target/release/doppelpad LICENSE-MIT LICENSE-APACHE THIRD_PARTY_LICENSES.md "linux-files/$name/"
          tar -czf "linux-files/$name.tar.gz" -C linux-files "$name"
          rm -r "linux-files/$name"
          echo "archive=linux-files/$name.tar.gz" >> "$GITHUB_OUTPUT"

      # The system libraries the AppImage carries, for THIRD_PARTY_NOTICES.md: each with the
      # Ubuntu package it comes from, then every package's copyright file in full, then the
      # license texts those files point to in /usr/share/common-licenses.
      - name: Libraries in the AppImage
        id: libs
        run: |
          appimage=$(ls target/release/bundle/appimage/*.AppImage)
          list="linux-files/$(basename "$appimage" .AppImage)_libraries.txt"
          extracted="$RUNNER_TEMP/appimage"
          rm -rf "$extracted" && mkdir -p "$extracted"
          (cd "$extracted" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract > /dev/null)
          find "$extracted/squashfs-root" \( -name '*.so' -o -name '*.so.*' \) -printf '%f\n' | sort -u |
            while read -r lib; do
              # A pattern that starts with / is a whole path to dpkg; */ finds the file in any folder.
              pkg=$(dpkg -S "*/$lib" 2> /dev/null | head -n1 | cut -d: -f1)
              echo "${pkg:--}|$lib"
            done | sort > "$RUNNER_TEMP/libs.txt"
          packages=$(cut -d'|' -f1 "$RUNNER_TEMP/libs.txt" | sort -u | grep -vx -- -) || true
          copyrights=$(for pkg in $packages; do echo "/usr/share/doc/$pkg/copyright"; done)
          # The texts the copyright files name; LGPL 3 (also as plain LGPL) is a set of
          # permissions on top of GPL 3.
          licenses=$(cat $copyrights 2> /dev/null | grep -o '/usr/share/common-licenses/[A-Za-z0-9.+_-]*' |
            sed 's|.*/||; s/\.$//' | sort -u) || true
          if echo "$licenses" | grep -qxE 'LGPL(-3)?'; then licenses=$(printf '%s\nGPL-3\n' "$licenses" | sort -u); fi
          rule() { printf '\n%s\n%s\n%s\n\n' "================================================================" "$1" "================================================================"; }
          {
            echo "Libraries in $(basename "$appimage"), by the Ubuntu 22.04 package they come from"
            echo "(- for none), with its source package and version. The source code of each is at"
            echo "https://launchpad.net/ubuntu/+source/<source package>/<version>; for the libraries"
            echo "under the GPL alone it is also in $(basename "$appimage" .AppImage)_gpl_sources.tar."
            echo "The copyright file of every package and the license texts they refer to follow."
            for pkg in $(cut -d'|' -f1 "$RUNNER_TEMP/libs.txt" | sort -u); do
              echo
              if [ "$pkg" = - ]; then
                echo "-"
              else
                echo "$pkg (source $(dpkg-query -W -f '${source:Package} ${source:Version}' "$pkg"))"
              fi
              echo "  files: $(awk -F'|' -v p="$pkg" '$1 == p { print $2 }' "$RUNNER_TEMP/libs.txt" | paste -sd ' ')"
              if [ -f "/usr/share/doc/$pkg/copyright" ]; then
                echo "  licenses: $(grep -h '^License:' "/usr/share/doc/$pkg/copyright" | sed 's/^License: *//' | sort -u | paste -sd ';' | sed 's/;/; /g')"
              fi
            done
          } > "$RUNNER_TEMP/summary.txt"
          {
            cat "$RUNNER_TEMP/summary.txt"
            for pkg in $packages; do
              rule "Copyright file of $pkg"
              cat "/usr/share/doc/$pkg/copyright" 2> /dev/null || echo "(the package has no copyright file)"
            done
            for license in $licenses; do
              [ -f "/usr/share/common-licenses/$license" ] || continue
              rule "License text: $license (/usr/share/common-licenses/$license)"
              cat "/usr/share/common-licenses/$license"
            done
          } > "$list"
          cat "$RUNNER_TEMP/summary.txt"
          echo
          echo "License texts: $(echo $licenses)"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      # Ubuntu's source packages of the libraries under the GPL alone, of the versions the
      # AppImage carries: with them in the process, the GPL covers the AppImage as a whole
      # (THIRD_PARTY_NOTICES.md). GPL_ONLY names their binary packages; a library list with
      # another one needs a look (docs/LINUX-TESTING.md, L9.8).
      - name: Source of the GPL libraries
        id: sources
        env:
          GPL_ONLY: libayatana-indicator3-7
        run: |
          appimage=$(ls target/release/bundle/appimage/*.AppImage)
          archive="linux-files/$(basename "$appimage" .AppImage)_gpl_sources.tar"
          for suite in jammy jammy-updates jammy-security; do
            echo "deb-src http://archive.ubuntu.com/ubuntu $suite main universe"
          done | sudo tee /etc/apt/sources.list.d/doppelpad-sources.list > /dev/null
          sudo apt-get update
          dir="$RUNNER_TEMP/gpl-sources"
          rm -rf "$dir" && mkdir -p "$dir"
          for pkg in $GPL_ONLY; do
            if ! grep -q "^$pkg|" "$RUNNER_TEMP/libs.txt"; then
              echo "::error::$pkg is no longer in the AppImage: take it out of GPL_ONLY"
              exit 1
            fi
            (cd "$dir" && apt-get source --download-only "$(dpkg-query -W -f '${source:Package}=${source:Version}' "$pkg")")
          done
          tar -cf "$archive" -C "$dir" .
          tar -tvf "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Command-line tool, library list and sources to the draft release
        if: env.RELEASE_ID != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE: ${{ steps.cli.outputs.archive }}
          LIST: ${{ steps.libs.outputs.list }}
          SOURCES: ${{ steps.sources.outputs.archive }}
        run: |
          upload() {
            curl -sSf -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: $2" \
              --data-binary @"$1" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$(basename "$1")" > /dev/null
          }
          upload "$ARCHIVE" application/gzip
          upload "$LIST" text/plain
          upload "$SOURCES" application/x-tar

      - uses: actions/upload-artifact@v4
        with:
          name: doppelpad-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            linux-files/
          if-no-files-found: error
          retention-days: 14

  # Like the Linux job: after the others on a tag (adding its files and its entries in
  # latest.json to the draft), alone when started by hand.
  macos:
    needs: [windows, linux]
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-latest
    env:
      RELEASE_ID: ${{ needs.windows.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Frontend dependencies
        working-directory: gui
        run: npm ci

      # The best signing set up: a Developer ID (signed and notarized), else the self-signed
      # certificate, else ad hoc. The bundler signs with APPLE_SIGNING_IDENTITY when it is set;
      # set but empty, it would try an identity named "".
      - name: Signing, as far as it is set up
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              {
                echo "$v<<DP_SECRET"
                printenv "$v"
                echo "DP_SECRET"
              } >> "$GITHUB_ENV"
            done
            exit 0
          fi
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "::warning::No signing secrets: the macOS app is signed ad hoc"
            exit 0
          fi
          # The self-signed certificate, in a keychain of its own on this runner.
          keychain="$RUNNER_TEMP/doppelpad-signing.keychain-db"
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" \
            "$keychain" > /dev/null
          # codesign signs only with identities in the keychain search list that are trusted
          # for code signing, and no one vouches for a self-signed certificate: this runner
          # trusts it, in the admin domain, which GitHub's runners let root change without a
          # prompt (changing the authorization rule for it is refused).
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "$MACOS_SIGNING_IDENTITY" -p "$keychain" > "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
          security find-identity -v -p codesigning "$keychain"
          echo "APPLE_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      # `tauri build` with tauri.macos.conf.json for both kinds of Mac: the .app, the .dmg and
      # the updater's .app.tar.gz with its .sig. Like the Linux job, it adds them to the draft
      # on a tag and only builds otherwise.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: gui
          args: --target universal-apple-darwin
          releaseId: ${{ env.RELEASE_ID }}
          tagName: ${{ env.RELEASE_ID && github.ref_name || '' }}
          releaseBody: ${{ needs.windows.outputs.notes }}
          releaseDraft: true

      # The app's signature in the log: who signed it, and the requirement macOS ties its
      # permissions to (stable across releases unless signed ad hoc).
      - name: Signature
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/Doppelpad.app
          codesign -dvv "$app" 2>&1 | grep -E '^(Identifier|Authority|Signature|TeamIdentifier)='
          codesign -d -r- "$app" 2>&1 | grep designated

      # `doppelpad` for both kinds of Mac in one file, with its licenses.
      - name: Command-line tool
        id: cli
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release -p doppelpad --target "$t"
          done
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)
          name="doppelpad_${version}_macos-universal"
          mkdir -p "macos-files/$name"
          lipo -create -output "macos-files/$name/doppelpad" \
            target/aarch64-apple-darwin/release/doppelpad target/x86_64-apple-darwin/release/doppelpad
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_LICENSES.md "macos-files/$name/"
          tar -czf "macos-files/$name.tar.gz" -C macos-files "$name"
          rm -r "macos-files/$name"
          echo "archive=macos-files/$name.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Command-line tool to the draft release
        if: env.RELEASE_ID != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE: ${{ steps.cli.outputs.archive }}
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/gzip" \
            --data-binary @"$ARCHIVE" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$(basename "$ARCHIVE")" > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: doppelpad-macos
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            macos-files/
          if-no-files-found: error
          retention-days: 14

[workspace]
resolver = "3"
members = ["crates/dp-core", "crates/dp-config", "crates/dp-platform", "crates/dp-ipc", "crates/dp-service", "crates/doppelpad", "gui/src-tauri"]
# The GUI crate joins `members` but stays out of `default-members`, so a plain
# `cargo build`/`cargo test` does not need the web frontend.
default-members = ["crates/dp-core", "crates/dp-config", "crates/dp-platform", "crates/dp-ipc", "crates/dp-service", "crates/doppelpad"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/doppelpad/doppelpad"
rust-version = "1.88"

[workspace.dependencies]
dp-core = { path = "crates/dp-core" }
dp-config = { path = "crates/dp-config" }
dp-platform = { path = "crates/dp-platform" }
dp-ipc = { path = "crates/dp-ipc" }
dp-service = { path = "crates/dp-service" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
interprocess = "2"
vigem-client = { version = "0.1.4", features = ["unstable_xtarget_notification"] }
windows-sys = "0.61"
nusb = "0.2"
ctrlc = "3"
trash = "5"
tauri-winres = "0.3"
tempfile = "3"
# Linux backend
evdev = "0.13"
libc = "0.2"
x11rb = "0.13"

# Lints on top of the defaults, for every member crate (`[lints] workspace = true`).
[workspace.lints.rust]
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_lossless = "warn"
redundant_clone = "warn"
unused_self = "warn"
needless_pass_by_ref_mut = "warn"
semicolon_if_nothing_returned = "warn"
match_same_arms = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# evdev 0.13.2 encodes UI_SET_PHYS with the size of a char instead of a pointer, so the kernel
# rejects it with EINVAL and no uinput device can be created. Fixed upstream ("fix set_phys
# ioctl"), not released yet. Drop this once a release includes it.
[patch.crates-io]
evdev = { git = "https://github.com/emberian/evdev", rev = "7fee138a341f73b81b9c4f8c59e3527c6a169ea3" }

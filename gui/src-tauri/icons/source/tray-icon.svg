<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Doppelpad tray icon, rendered at 32 px: the two pads without the tile, as large as they fit. -->
  <defs>
    <!-- One controller, centred on its own origin. -->
    <path id="pad" d="M-180,-150 C-80,-162 80,-162 180,-150 C260,-145 305,-110 322,-40 C340,30 360,120 362,170 C365,235 320,268 272,262 C235,257 215,232 198,200 L172,152 C160,130 142,120 118,120 H-118 C-142,120 -160,130 -172,152 L-198,200 C-215,232 -235,257 -272,262 C-320,268 -365,235 -362,170 C-360,120 -340,30 -322,-40 C-305,-110 -260,-145 -180,-150 Z"/>
    <g id="front-controls">
      <rect x="-290" y="-30" width="210" height="84" rx="10"/>
      <rect x="-227" y="-93" width="84" height="210" rx="10"/>
      <circle cx="215" cy="-30" r="46"/>
      <circle cx="135" cy="60" r="46"/>
    </g>
    <g id="back-controls">
      <circle cx="215" cy="-30" r="46"/>
    </g>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ee6cf"/>
      <stop offset="1" stop-color="#0fa596"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d43e0"/>
    </linearGradient>
    <!-- The twin loses a band around the front pad, so the two never touch. -->
    <mask id="back-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <use href="#pad" transform="translate(442 544) scale(0.98)" fill="#000" stroke="#000" stroke-width="130" stroke-linejoin="round"/>
      <use href="#back-controls" transform="translate(582 374) scale(0.98)" fill="#000"/>
    </mask>
    <mask id="front-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <use href="#front-controls" transform="translate(442 544) scale(0.98)" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#back-mask)"><use href="#pad" transform="translate(582 374) scale(0.98)" fill="url(#back)"/></g>
  <g mask="url(#front-mask)"><use href="#pad" transform="translate(442 544) scale(0.98)" fill="url(#front)"/></g>
</svg>

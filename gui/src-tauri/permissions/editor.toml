# The editor window may call every command of the app (capabilities/default.json); the
# overlay windows only what their pages call (capabilities/overlay.json). A test checks that
# this set, build.rs and main.rs name the same commands.

[[set]]
identifier = "editor"
description = "Every command of the app."
permissions = [
  "allow-catalog",
  "allow-library-scan",
  "allow-game-create",
  "allow-game-update",
  "allow-game-delete",
  "allow-game-duplicate",
  "allow-running-programs",
  "allow-game-set-picture",
  "allow-game-picture",
  "allow-foreground-program",
  "allow-installed-games",
  "allow-game-create-from-store",
  "allow-game-create-template",
  "allow-config-from-template",
  "allow-open-driver-page",
  "allow-game-export",
  "allow-game-import",
  "allow-preset-list",
  "allow-preset-save",
  "allow-preset-load",
  "allow-sheet-save",
  "allow-config-load",
  "allow-config-save",
  "allow-config-check",
  "allow-config-versions",
  "allow-config-create",
  "allow-config-duplicate",
  "allow-config-delete",
  "allow-config-import",
  "allow-reveal",
  "allow-apply-to-slot",
  "allow-select-slot",
  "allow-clear-slot",
  "allow-own-slots",
  "allow-set-remap",
  "allow-set-auto-switch",
  "allow-set-lights",
  "allow-set-blocked",
  "allow-set-groups",
  "allow-set-power-off-after",
  "allow-power-off",
  "allow-set-layout",
  "allow-forget-layout",
  "allow-set-dsu",
  "allow-set-runtime-options",
  "allow-set-http",
  "allow-new-http-token",
  "allow-set-preferred-device",
  "allow-refresh-drivers",
  "allow-rescan-devices",
  "allow-hotkeys-get",
  "allow-hotkeys-set",
  "allow-hotkeys-pause",
  "allow-test-turn",
  "allow-gyro-calibrate",
  "allow-gyro-auto",
  "allow-gyro-reset",
  "allow-rewasd-status",
  "allow-rewasd-quit",
  "allow-live-subscribe",
  "allow-settings-get",
  "allow-settings-set",
  "allow-autostart-get",
  "allow-autostart-set",
  "allow-window-show",
  "allow-library-place",
  "allow-library-target",

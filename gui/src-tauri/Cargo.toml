[package]
name = "dp-gui"
description = "Doppelpad desktop app: editor, live controller view, tray and the remapping service"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "doppelpad-gui"
path = "src/main.rs"

[dependencies]
dp-core.workspace = true
dp-config.workspace = true
dp-ipc.workspace = true
dp-platform.workspace = true
dp-service.workspace = true

serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# `macos-private-api`: transparent windows (the overlays) need AppKit's private API on macOS.
# It does nothing elsewhere, and must match `app.macOSPrivateApi` in tauri.conf.json.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# Without `zip`: the update is the setup itself, not a zipped one (createUpdaterArtifacts).
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }

# Overlays on Wayland are layer-shell surfaces (overlay.rs); `gtk` is the version Tauri uses.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }

[features]
# Embed the built frontend instead of loading the dev server (set by `tauri build`).
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true

[package]
name = "dp-platform"
description = "Operating-system backends (input, virtual pads, device hiding) for Doppelpad"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
dp-core.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
crossbeam-channel.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The hardware tests' log
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
vigem-client.workspace = true
nusb.workspace = true
windows = { workspace = true, features = [
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Radios",
    "Foundation_Collections",
    "Storage_Streams",
] }
windows-future.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Devices_Bluetooth",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Media",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Properties",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Shutdown",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Magnification",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2.workspace = true
libc.workspace = true
nusb.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-application-services.workspace = true
objc2-core-bluetooth.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-foundation.workspace = true
objc2-io-kit.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
evdev.workspace = true
libc.workspace = true
x11rb.workspace = true
zbus.workspace = true

[lints]
workspace = true
